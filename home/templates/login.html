{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Laundry Express | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="{% static 'assets/img/logos/RRLOGO.png' %}" />

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      body {
        min-height: 100vh;
        background-image: url("{% static 'img/hero/hero-img-4.jpg' %}");
        background-size: cover;
        background-position: center;
        font-family: 'Segoe UI', sans-serif;
      }

      .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .login-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 35px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header img {
        width: 80px;
        margin-bottom: 10px;
        height: 70px;
      }

      .login-header h2 {
        font-weight: 600;
        margin-bottom: 5px;
      }

      .login-header p {
        color: #6c757d;
        font-size: 14px;
      }

      .form-group label {
        font-weight: 500;
        margin-bottom: 5px;
      }

      .input-group-text {
        background-color: #0d6efd;
        color: #fff;
        border: none;
      }

      .form-control {
        border-left: none;
      }

      .form-control:focus {
        box-shadow: none;
        border-color: #0d6efd;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0d6efd, #084298);
        border: none;
        font-weight: 500;
        padding: 10px;
        transition: all 0.3s ease;
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 20px rgba(13, 110, 253, 0.4);
      }

      .login-footer {
        font-size: 13px;
        color: #6c757d;
      }
    </style>
  </head>

  <body>
    <section class="login-page">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="login-card">
              <!-- HEADER -->
              <div class="login-header text-center">
                <img
                  src="{% static 'img/logos/RRLOGO.png' %}"
                  alt="RR Laundry Express"
                />
                <h2>Welcome Back</h2>
                <p>Access your Linen Management Dashboard</p>
              </div>

              <!-- ERROR MESSAGES -->
              {% if messages %} {% for message in messages %}
              <div class="alert alert-danger text-center">{{ message }}</div>
              {% endfor %} {% endif %}

              <!-- LOGIN FORM -->
              <form method="POST">
                {% csrf_token %}

                <div class="form-group mb-3">
                  <label>Username</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fa-solid fa-user"></i>
                    </span>
                    <input
                      type="text"
                      name="username"
                      class="form-control"
                      placeholder="Enter username"
                      required
                    />
                  </div>
                </div>

                <div class="form-group mb-4">
                  <label>Password</label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fa-solid fa-lock"></i>
                    </span>
                    <input
                      type="password"
                      name="password"
                      class="form-control"
                      placeholder="Enter password"
                      required
                    />
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In
                </button>
              </form>

              <div class="login-footer text-center mt-4">
                Authorized access only<br />
                <strong>RR Laundry Express LMS</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
