<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Login | LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #f59e0b; --dark: #0f172a; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .logo { font-size: 40px; margin-bottom: 10px; }
        h2 { color: var(--dark); margin-bottom: 5px; }
        p { color: #64748b; font-size: 0.9rem; margin-bottom: 25px; }
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.85rem; color: #475569; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; transition: 0.3s; font-size: 1rem; }
        input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🚚</div>
        <h2>Delivery Boy Login</h2>
        <p>Enter your credentials to start your shift</p>
        <form action="delivery_dashboard.html">
            <div class="input-group">
                <label>Mobile Number</label> <input type="tel" placeholder="Enter 10 digit number" required>
            </div>
            <div class="input-group">
                <label>Password / OTP</label> <input type="password" placeholder="Enter password or OTP" required>
            </div>
            <button type="submit" class="btn-login">Login Now</button>
        </form>
    </div>
</body>
</html>
