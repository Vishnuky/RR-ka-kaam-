<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Logistics RFID System</title>
    <style>
        :root {
            --primary: #00b894;
            --secondary: #0984e3;
            --danger: #d63031;
            --dark: #2d3436;
            --light: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #dfe6e9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-card {
            background: white;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
        }

        /* Tab Styling */
        .tabs {
            display: flex;
            background: #f1f2f6;
            padding: 5px;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #7f8c8d;
            transition: 0.3s;
            border-radius: 18px;
        }

        .tab.active {
            background: white;
            color: var(--secondary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Content Area */
        .content {
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--dark);
        }

        .header p {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 30px;
        }

        /* Scanner Pulse Animation */
        .scanner-visual {
            width: 120px;
            height: 120px;
            background: rgba(9, 132, 227, 0.1);
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .scanner-visual::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid var(--secondary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .status-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 5px solid #ccc;
        }

        .status-label {
            display: block;
            font-size: 0.75rem;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
        }

        /* Location Footer */
        .location-footer {
            background: #fdfdfd;
            padding: 15px;
            border-top: 1px solid #eee;
            font-size: 0.8rem;
            color: #636e72;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .dot { height: 8px; width: 8px; background: var(--primary); border-radius: 50%; }

        button {
            background: var(--dark);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:active { transform: scale(0.98); }
        
        /* Success Theme */
        .theme-pickup .status-box { border-left-color: var(--primary); }
        .theme-drop .status-box { border-left-color: var(--secondary); }

    </style>
</head>
<body>

<div class="app-card">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('pickup')">Pickup</div>
        <div class="tab" onclick="switchTab('drop')">Drop</div>
    </div>

    <div class="content" id="mainContent">
        <div class="header">
            <h1 id="title">Hospital Pickup</h1>
            <p id="subtitle">Place RFID tag near the scanner</p>
        </div>

        <div class="scanner-visual">
            <span id="icon" style="font-size: 40px;">🏥</span>
        </div>

        <div class="status-box">
            <span class="status-label">Current Status</span>
            <div class="status-value" id="statusText">Awaiting Scan...</div>
        </div>

        <button onclick="handleAction()" id="actionBtn">Simulate Scan</button>
    </div>

    <div class="location-footer">
        <div class="dot"></div>
        <span id="locationDisplay">Fetching GPS Location...</span>
    </div>
</div>

<script>
    let currentMode = 'pickup';

    // 1. Tab Switching Logic
    function switchTab(mode) {
        currentMode = mode;
        const tabs = document.querySelectorAll('.tab');
        const title = document.getElementById('title');
        const statusText = document.getElementById('statusText');
        const icon = document.getElementById('icon');
        const btn = document.getElementById('actionBtn');

        tabs.forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        if(mode === 'pickup') {
            title.innerText = "Hospital Pickup";
            statusText.innerText = "Awaiting Scan...";
            icon.innerText = "🏥";
            btn.style.background = "#2d3436";
        } else {
            title.innerText = "Laundry Drop";
            statusText.innerText = "Ready for Drop...";
            icon.innerText = "🧺";
            btn.style.background = "#0984e3";
        }
    }

    // 2. Scan Action (Updates based on images provided)
    function handleAction() {
        const statusText = document.getElementById('statusText');
        statusText.innerText = "Scanning...";
        
        setTimeout(() => {
            if(currentMode === 'pickup') {
                statusText.innerText = "Picked Up";
                statusText.style.color = "#00b894";
            } else {
                statusText.innerText = "Dropped at Laundry";
                statusText.style.color = "#0984e3";
            }
            alert("Success: Record updated in system!");
        }, 1200);
    }

    // 3. Auto Location (Browser Geolocation API)
    function fetchLocation() {
        const locDisplay = document.getElementById('locationDisplay');
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                locDisplay.innerText = `Live: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
            }, () => {
                locDisplay.innerText = "Location: Hospital Zone A";
            });
        }
    }

    // Initial Load
    fetchLocation();
</script>

</body>
</html>
