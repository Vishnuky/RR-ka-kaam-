<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Pickup RFID Scan</title>
    <style>
        /* CSS Section */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { color: var(--primary-color); margin-bottom: 1.5rem; }

        .scan-area {
            border: 2px dashed var(--accent-color);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            background: #ebf5fb;
            transition: all 0.3s ease;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            margin-top: 10px;
            background: #eee;
            color: #777;
        }

        .status-picked {
            background: var(--success-color);
            color: white;
        }

        .location-box {
            font-size: 0.85rem;
            color: #666;
            margin-top: 1rem;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover { background: #2980b9; }

        .icon { font-size: 3rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pickup Scan</h2>
    
    <div class="scan-area" id="scanArea">
        <div class="icon">📡</div>
        <p id="instruction">Tap RFID Tag or Click to Scan</p>
        <div id="statusBadge" class="status-badge">Awaiting Scan</div>
    </div>

    <div class="location-box">
        📍 <strong>Location:</strong> <span id="locationText">Detecting...</span>
    </div>

    <button onclick="simulateScan()" style="margin-top: 20px;">Simulate RFID Scan</button>
</div>

<script>
    // JS Section
    
    // 1. Auto Location Feature
    window.onload = function() {
        getLocation();
    };

    function getLocation() {
        const locText = document.getElementById('locationText');
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    locText.innerText = `Lat: ${position.coords.latitude.toFixed(4)}, Long: ${position.coords.longitude.toFixed(4)}`;
                },
                () => {
                    locText.innerText = "Location access denied";
                }
            );
        } else {
            locText.innerText = "Geolocation not supported";
        }
    }

    // 2. Scan Simulation & Status Update
    function simulateScan() {
        const badge = document.getElementById('statusBadge');
        const instruction = document.getElementById('instruction');
        const scanArea = document.getElementById('scanArea');

        // UI Feedback
        instruction.innerText = "Scanning...";
        
        setTimeout(() => {
            // Update Status to "Picked Up"
            badge.innerText = "Picked Up";
            badge.classList.add('status-picked');
            instruction.innerText = "RFID Tag Recognized!";
            scanArea.style.borderColor = "#27ae60";
            scanArea.style.background = "#eafaf1";
            
            console.log("Status Updated: Picked Up");
            console.log("Location Logged at Scan");
        }, 1500);
    }
</script>

</body>
</html>
