<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
 :root {
           --primary-color: #007bff;
            --secondary-color: #6c757d;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .login-card {
            background: var(--glass-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h2 {
            margin-bottom: 10px;
            color: #1e293b;
        }
        p {
            margin-bottom: 30px;
            color: #475569;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 45px;
            color: #94a3b8;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px 12px 12px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        }
        .role-field {
            background-color: #f1f5f9;
            color: #0369a1;
            font-weight: bold;
            border-style: dashed;
            cursor: not-allowed;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0369a1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-btn:hover {
            background: #d97706;
        }
        .login-btn i {
            margin-left: 10px;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }

    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🔐</div>
        <h2>Admin Login</h2>
        <p>Enter your credentials to access the admin panel</p>
        <form action="#" method="POST" id="AdminLoginForm">
           <div class="input-group">
                <label>System Role</label>
                <i class="fas fa-user-tag"></i>
                <input type="text" value="Admin" class="role-field" readonly>
            </div>

            <div class="input-group">
                <label>Username</label>
                <i class="fas fa-user"></i>
                <input type="text" id="username" placeholder="Enter staff id" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">
                <span>Login as Admin</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>
          <div id="error-msg"></div>

        <p class="footer-note">Secure Access for Hospital Personnel Only</p>
    </div>
    </div>
      <script>
        document.getElementById('AdminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg');
            const btn = document.querySelector('.login-btn');
            btn.innerHTML = 'Checking... <i class="fas fa-spinner fa-spin"></i>';
            btn.style.opacity = '0.8';

            setTimeout(() => {
                if(user === "admin" && pass === "123") {
                    errorBox.style.color = "#10b981";
                    errorBox.innerText = "Success! Redirecting...";
                     window.location.href = "admin-dashboard.html";
                } else {
                    errorBox.style.color = "#ef4444";
                    errorBox.innerText = "Invalid credentials. Please try again.";
                    btn.innerHTML = '<span>Login as Staff</span> <i class="fas fa-sign-in-alt"></i>';
                    btn.style.opacity = '1';
                }
            }, 800);
        });
    </script>
</body>
</html>
